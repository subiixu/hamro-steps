# Settings for handoffs/bin/nayo. Plain shell assignments; nayo sources this file.

# The Nayo kit these files came from. Araniko sets it when it installs or updates
# the kit (Settings → Nayo → Projects) and compares it with its own; leave it be.
NAYO_KIT_VERSION=2026-11-17.3

# Claude sessions running at once, Nayo included, used only when `araniko` has no
# workers.max setting (Settings → Max workers caps workers otherwise). `nayo spawn`
# refuses a Claude worker past this; Codex and OpenCode workers don't count.
# 3 = Nayo + 2 workers.
NAYO_MAX_CLAUDE=3

# Usage band thresholds, as % of the 5-hour window. The band also turns amber when
# the burn rate is on pace to use the whole window before it resets. These only
# drive the band the script displays: on Araniko the daemon uses the settings
# usage.amber/usage.red; on Superset/tmux the script still checks fable in amber itself.
NAYO_AMBER=50
NAYO_RED=75

# After this many idle minutes Nayo's prompt cache has (nearly) expired, so a big
# context costs more to reload than to rebuild from OPEN.md. The prompt guard stops
# the user's first message once and suggests clearing.
NAYO_IDLE_MIN=55
NAYO_GUARD_TOKENS=100000   # the guard stays quiet below this much context

NAYO_PUSH=1                # `nayo merge` pushes after committing (0 = don't)

# Lock classes for `nayo lock <class> [--wait <sec>] -- <command…>`, which runs a
# heavy command under a named lease so workers queue for it instead of piling on:
# NAYO_LOCK_<class>="<scope> <capacity>", scope host (the whole Mac) or checkout
# (this checkout only), then how many may hold it at once. Waiters go first in, first
# out; the lease ends when the command and everything it started exit, even on
# SIGKILL. docker ("host 1") and suite ("checkout 1") are built in; these override.
# NAYO_LOCK_docker="host 1"      # e.g. "test:docker": "handoffs/bin/nayo lock docker -- vitest run"
# NAYO_LOCK_e2e="checkout 2"
