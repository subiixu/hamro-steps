# Settings for handoffs/bin/jarvis. Plain shell assignments; jarvis sources this file.

# The Jarvis kit these files came from. Ultron sets it when it installs or updates
# the kit (Settings → Jarvis → Projects) and compares it with its own; leave it be.
JARVIS_KIT_VERSION=2026-11-14

# Claude sessions running at once, Jarvis included, used only when `ultron` has no
# workers.max setting (Settings → Max workers caps workers otherwise). `jarvis spawn`
# refuses a Claude worker past this; Codex and OpenCode workers don't count.
# 3 = Jarvis + 2 workers.
JARVIS_MAX_CLAUDE=3

# Usage band thresholds, as % of the 5-hour window. The band also turns amber when
# the burn rate is on pace to use the whole window before it resets.
JARVIS_AMBER=50
JARVIS_RED=75

# After this many idle minutes Jarvis's prompt cache has (nearly) expired, so a big
# context costs more to reload than to rebuild from OPEN.md. The prompt guard stops
# the user's first message once and suggests clearing.
JARVIS_IDLE_MIN=55
JARVIS_GUARD_TOKENS=100000   # the guard stays quiet below this much context

JARVIS_PUSH=1                # `jarvis merge` pushes after committing (0 = don't)
