# Source of truth for the Xcode project. Run `xcodegen generate` in ios/;
# the generated HamroSteps.xcodeproj is git-ignored.
#
# Layout:
#   HamroSteps/  app-only code (HealthKit, ThinkingOrbsKit, screens)
#   Shared/      code + assets a future WidgetKit extension will also compile
#                (models, step aggregation, formatting, icons, colours).
#                It must not import HealthKit or ThinkingOrbsKit.
name: HamroSteps

options:
  bundleIdPrefix: com.bixustudio
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: JQ2D4NNS3B
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Colours and icons go through the typed wrappers in Shared/UI.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    # ConvexMobile's Rust core ships no x86_64 simulator slice.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  LibrariesDev:
    url: https://github.com/Jakubantalik/Libraries.dev
    branch: main
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.2

targets:
  HamroSteps:
    type: application
    platform: iOS
    sources:
      - path: HamroSteps
      - path: Shared
    dependencies:
      - package: LibrariesDev
        product: ThinkingOrbsKit
      - package: ConvexMobile
        product: ConvexMobile
      - sdk: HealthKit.framework
      - sdk: AuthenticationServices.framework
    # XcodeGen rewrites the .entitlements file from these properties on
    # every generate, so they must live here, not in the file.
    entitlements:
      path: HamroSteps/Resources/HamroSteps.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bixustudio.hamrosteps
        PRODUCT_NAME: HamroSteps
        GENERATE_INFOPLIST_FILE: YES
        # Custom keys (the Convex URLs) merged into the generated Info.plist.
        INFOPLIST_FILE: HamroSteps/Services/Convex/Info.plist
        # Placeholders: set the real deployment per environment (Xcode build
        # setting or an xcconfig). While they contain "placeholder" the app
        # treats Convex as not configured (ConvexConfig returns nil).
        CONVEX_URL: https://harmless-dolphin-642.ap-southeast-2.convex.cloud
        CONVEX_SITE_URL: https://harmless-dolphin-642.ap-southeast-2.convex.site
        INFOPLIST_KEY_CFBundleDisplayName: Hamro Steps
        INFOPLIST_KEY_NSHealthShareUsageDescription: Hamro Steps reads your step count to share it with your family.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: healthkit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  HamroStepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HamroStepsTests
    dependencies:
      - target: HamroSteps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bixustudio.hamrosteps.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HamroSteps.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HamroSteps"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HamroSteps:
    build:
      targets:
        HamroSteps: all
        HamroStepsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HamroStepsTests
